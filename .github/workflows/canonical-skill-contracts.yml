name: Canonical Skill Contracts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-canonical-skill-contracts:
    name: Validate Canonical Skill Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate declared canonical rule contracts
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import sys

          skills_dir = "skills"
          errors = []
          validated = []

          for skill_name in sorted(os.listdir(skills_dir)):
              skill_dir = os.path.join(skills_dir, skill_name)
              if not os.path.isdir(skill_dir):
                  continue

              metadata_path = os.path.join(skill_dir, "metadata.json")
              skill_path = os.path.join(skill_dir, "SKILL.md")
              rules_dir = os.path.join(skill_dir, "rules")
              if not os.path.isfile(metadata_path) or not os.path.isfile(skill_path):
                  continue

              with open(metadata_path, "r", encoding="utf-8") as f:
                  metadata = json.load(f)

              meta = metadata.get("meta", {})
              if meta.get("canonical_sources") != ["SKILL.md", "rules/"]:
                  continue

              validated.append(skill_name)

              if not os.path.isdir(rules_dir):
                  errors.append(f"{skill_name}: canonical rules/ directory is missing")
                  continue

              rule_ids = sorted(
                  filename[:-3]
                  for filename in os.listdir(rules_dir)
                  if filename.endswith(".md") and not filename.startswith("_")
              )

              declared_count = meta.get("rule_count")
              if declared_count != len(rule_ids):
                  errors.append(
                      f"{skill_name}: meta.rule_count={declared_count!r} but rules/ contains {len(rule_ids)} canonical rule files"
                  )

              with open(skill_path, "r", encoding="utf-8") as f:
                  skill = f.read()

              for rule_id in rule_ids:
                  if f"rules/{rule_id}.md" not in skill:
                      errors.append(
                          f"{skill_name}: SKILL.md does not reference canonical rule file rules/{rule_id}.md"
                      )

          if errors:
              print("Canonical skill contract validation failed:")
              for error in errors:
                  print(" - " + error)
              sys.exit(1)

          print(
              f"Validated {len(validated)} canonical skill contracts: "
              + ", ".join(validated)
          )
          PYEOF
